# Build Velo for Windows, macOS, and Linux and attach installers to a GitHub Release.
#
# Publishing to GitHub Releases:
#   • Build jobs use electron-builder --publish never. Each job uploads its installer plus
#     electron-updater files (latest.yml / latest-mac.yml / latest-linux.yml + .blockmap).
#     Unpacked dirs (*.pak, etc.) are not uploaded.
#   • The publish-release job uploads only those assets (sequentially via `preserve_order`).
#
# Usage:
#   1. Bump "version" in package.json (and commit).
#   2. Tag and push: git tag v1.0.2 && git push origin v1.0.2
#
# The tag should match the version (e.g. v1.0.2 ↔ 1.0.2 in package.json).
#
# Optional: run manually from Actions → "Release" → Run workflow (builds only; see
# release job `if:` below — enable workflow_dispatch uploads by adjusting that guard).

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Skip electron-builder GitHub upload; publish-release attaches these files to the Release.
      - name: Build Windows installer
        run: npm run dist:win -- --publish never

      - name: Stage Windows artifacts
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p win-out
          cp release/latest.yml win-out/
          shopt -s nullglob
          exes=(release/Velo-Installer-Windows-*.exe)
          if [ ${#exes[@]} -eq 0 ]; then
            echo "Missing Windows .exe in release/"; ls -la release; exit 1
          fi
          for f in "${exes[@]}"; do cp "$f" win-out/; done
          for f in release/Velo-Installer-Windows-*.exe.blockmap; do
            [ -f "$f" ] && cp "$f" win-out/ || true
          done
          ls -la win-out

      - uses: actions/upload-artifact@v4
        with:
          name: velo-windows
          if-no-files-found: error
          path: win-out/*

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build macOS DMG
        run: npm run dist:mac -- --publish never

      - name: Stage macOS artifacts
        run: |
          set -euxo pipefail
          mkdir -p mac-out
          cp release/latest-mac.yml mac-out/
          shopt -s nullglob
          dmgs=(release/Velo-Installer-macOS-*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "Missing macOS .dmg in release/"; ls -la release; exit 1
          fi
          for f in "${dmgs[@]}"; do cp "$f" mac-out/; done
          for f in release/Velo-Installer-macOS-*.dmg.blockmap; do
            [ -f "$f" ] && cp "$f" mac-out/ || true
          done
          ls -la mac-out

      - uses: actions/upload-artifact@v4
        with:
          name: velo-macos
          if-no-files-found: error
          path: mac-out/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # AppImage tooling often needs FUSE on Ubuntu runners.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 squashfs-tools

      - run: npm ci

      - name: Build Linux AppImage
        run: npm run dist:linux -- --publish never

      - name: Stage Linux artifacts
        run: |
          set -euxo pipefail
          mkdir -p linux-out
          cp release/latest-linux.yml linux-out/
          shopt -s nullglob
          imgs=(release/Velo-Installer-Linux*.[Aa]pp[Ii]mage)
          if [ ${#imgs[@]} -eq 0 ]; then
            echo "No Velo-Installer-Linux *.AppImage in release/ — listing:"
            ls -la release
            exit 1
          fi
          cp -v "${imgs[0]}" linux-out/
          for f in release/Velo-Installer-Linux*.blockmap; do
            [ -f "$f" ] && cp -v "$f" linux-out/ || true
          done
          ls -la linux-out

      - uses: actions/upload-artifact@v4
        with:
          name: velo-linux
          if-no-files-found: error
          path: linux-out/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes for this tag from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ ! -f CHANGELOG.md ]; then
            echo "Add a ## [$VERSION] section to CHANGELOG.md before tagging." > release_body.md
          else
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { p=1; next }
              p && $0 ~ "^## " { exit }
              p { print }
            ' CHANGELOG.md > release_body.md
            if [ ! -s release_body.md ]; then
              echo "No changelog section \`## [$VERSION]\` found. Update CHANGELOG.md and re-tag if needed." >> release_body.md
            fi
          fi
          echo "--- Release notes (from CHANGELOG) ---"
          cat release_body.md

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts (debug)
        run: find artifacts -type f | sort

      - name: Collect release assets (installers + electron-updater metadata)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          copy_one () {
            local pat="$1"
            local f
            f=$(find artifacts -type f -name "$pat" | head -n1)
            if [[ -z "$f" ]]; then
              echo "Missing file matching $pat under artifacts/"
              find artifacts -type f | sort || true
              exit 1
            fi
            cp "$f" "release-assets/$(basename "$f")"
            echo "Collected $(basename "$f")"
          }
          copy_one 'Velo-Installer-Windows-*.exe'
          copy_one 'Velo-Installer-macOS-*.dmg'
          f_linux=$(find artifacts -type f -iname 'Velo-Installer-Linux*.AppImage' | head -n1)
          if [[ -z "$f_linux" ]]; then
            echo "Missing Linux AppImage under artifacts/"
            find artifacts -type f | sort || true
            exit 1
          fi
          cp "$f_linux" "release-assets/$(basename "$f_linux")"
          echo "Collected $(basename "$f_linux")"
          copy_one 'latest.yml'
          copy_one 'latest-mac.yml'
          copy_one 'latest-linux.yml'
          copy_one 'Velo-Installer-Windows-*.exe.blockmap'
          copy_one 'Velo-Installer-macOS-*.dmg.blockmap'
          bm=$(find artifacts -type f -iname 'Velo-Installer-Linux*.blockmap' | head -n1 || true)
          if [[ -n "$bm" ]]; then
            cp "$bm" "release-assets/$(basename "$bm")"
            echo "Collected $(basename "$bm")"
          fi
          ls -la release-assets

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          body_path: release_body.md
          generate_release_notes: true
          preserve_order: true
          fail_on_unmatched_files: true
          # Exact set from collect step (Linux .blockmap only when electron-builder emits it).
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
